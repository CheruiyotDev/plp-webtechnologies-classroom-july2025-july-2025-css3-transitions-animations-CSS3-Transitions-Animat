<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Animation Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>🎬 Interactive CSS & JavaScript Animations</h1>
      <p>Hover, click, and interact to see the effects in action.</p>
    </header>

    <!-- Button to Animate Box -->
    <section>
      <button id="animateBoxBtn">Bounce the Box</button>
      <div class="box" id="animatedBox"></div>
    </section>

    <!-- Modal Trigger -->
    <section>
      <button id="openModalBtn">Open Modal</button>
      <div class="modal" id="modal">
        <div class="modal-content">
          <p>This is a modal popup. 🎉</p>
          <button id="closeModalBtn">Close</button>
        </div>
      </div>
    </section>

    <footer>
      <p>Made with 💖 using HTML, CSS3, and JavaScript</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
